<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Swindle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: -1;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center">
    <!-- Background Video -->
    <video class="video-bg" autoplay muted loop playsinline>
        <source src="background.mp4" type="video/mp4">
    </video>

    <!-- Dark Overlay -->
    <div class="overlay"></div>

    <!-- Content -->
    <main class="text-center text-white p-8">
        <!-- Logo -->
        <img
            src="logo.png"
            alt="Swindle"
            class="w-48 h-48 sm:w-64 sm:h-64 mx-auto mb-8 object-contain"
        >

        <!-- Links -->
        <nav class="flex flex-col gap-4">
            <a
                href="#"
                class="px-8 py-3 border border-white rounded-full hover:bg-white hover:text-black transition-colors duration-300"
            >
                Listen
            </a>
            <a
                href="#"
                class="px-8 py-3 border border-white rounded-full hover:bg-white hover:text-black transition-colors duration-300"
            >
                Shows
            </a>
            <a
                href="#"
                class="px-8 py-3 border border-white rounded-full hover:bg-white hover:text-black transition-colors duration-300"
            >
                Contact
            </a>
        </nav>
    </main>
</body>
</html>
