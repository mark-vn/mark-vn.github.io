<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>SWINDLE EPI - 2002-2006</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: monospace;
        }

        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: -1;
        }
    </style>
    <link rel="icon" href="favicon.ico" sizes="32x32">
    <script src="https://kit.fontawesome.com/99a4ff3e68.js" crossorigin="anonymous"></script>
</head>

<body class="min-h-screen flex items-center justify-center">
    <!-- Background Video -->
    <video class="video-bg" autoplay muted loop playsinline>
        <source src="grange.mp4" type="video/mp4">
    </video>

    <!-- Dark Overlay -->
    <div class="overlay"></div>

    <!-- Content -->
    <main class="text-center text-white p-8">
        <!-- Logo -->
        <img src="swindle-text.png" alt="SWINDLE EPI band logo, hand drawn in white"
            class="w-64 h-64 sm:w-64 sm:h-64 mx-auto object-contain">
        <p class="center mb-4">ALBANY HARDCORE PUNK 2002-2006</p>
        <nav class="block flex flex-col gap-4 mb-8">
            <a href="https://open.spotify.com/album/1oFK9QVmuMKtiTPcduYkMr?si=fqbpzAprRrWJANHQamHafg" target="_blank"
                class="px-8 py-3 border border-white hover:bg-white hover:text-black transition-colors duration-300">
                <i class="fa-brands fa-spotify"></i> SPOTIFY
            </a>
            <a href="https://swindle-epi.bandcamp.com/album/winners-burning" target="_blank"
                class="px-8 py-3 border border-white  hover:bg-white hover:text-black transition-colors duration-300">
                <i class="fa-brands fa-bandcamp"></i> BANDCAMP
            </a>
            <a href="https://drive.google.com/drive/folders/1ZjHaDZqSZu6wh1g_CsB8N590a4Qdoilm?usp=drive_link"
                target="_blank"
                class="px-8 py-3 border border-white hover:bg-white hover:text-black transition-colors duration-300">
                <i class="fa-brands fa-google-drive"></i> ARCHIVE
            </a>
        </nav>
    </main>
</body>

</html>
